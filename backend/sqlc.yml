# yaml-language-server: $schema=https://www.schemastore.org/sqlc-2.0.json

version: "2"
sql:
    - engine: sqlite
      schema: "sqlite/migrations/*.sql"
      queries: "features/auth/authsqlite/*.sql"
      gen:
          go:
              package: gen
              out: "features/auth/authsqlite/internal/gen"
              omit_unused_structs: true
    - engine: sqlite
      schema: "sqlite/migrations/*.sql"
      queries: "features/students/studentssqlite/*.sql"
      gen:
          go:
              package: gen
              out: "features/students/studentssqlite/internal/gen"
              omit_unused_structs: true
    - engine: sqlite
      schema: "sqlite/migrations/*.sql"
      queries: "features/tutors/tutorssqlite/*.sql"
      gen:
          go:
              package: gen
              out: "features/tutors/tutorssqlite/internal/gen"
              omit_unused_structs: true
