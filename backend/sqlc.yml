# yaml-language-server: $schema=https://www.schemastore.org/sqlc-2.0.json

version: "2"
sql:
  - engine: sqlite
    schema: "sqlite/migrations/*.sql"
    queries: "auth/authsqlite/*.sql"
    gen:
      go:
        package: gen
        out: "auth/authsqlite/internal/gen"
        omit_unused_structs: true
