# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  run:
    desc: "Run the backend process"
    cmds:
      - go run ./cmd/api
    env:
        LOG_LEVEL: -4
        # Skip the readiness drain window on every dev restart — it exists to
        # give a load balancer time to notice a draining pod, which doesn't
        # apply to `go run`/local dev.
        READINESS_DRAIN_PERIOD: 0s
    silent: true
  test:
    desc: "Run the test suit (unit and integration tests)"
    cmds:
      - go test ./...
    silent: true
  unit-test:
    desc: "Run the unit test suit"
    cmds:
      - go test -short ./...
    silent: true
  sqlc:
    desc: "Run the sqlc code generation"
    cmds:
      - go tool -modfile=go.tool.mod sqlc generate
    silent: true
  vet:
    desc: "Run go vet across the module"
    cmds:
      - go vet ./...
    silent: true
  build:
    desc: "Build all packages"
    cmds:
      - go build ./...
    silent: true
  verify:
    desc: "Pre-release check: vet, build, and the full test suite with the race detector"
    cmds:
      - task: vet
      - task: build
      - go test -race ./...
    silent: true
