# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
    backend:
        taskfile: ./backend
        dir: ./backend
    frontend:
        taskfile: ./frontend
        dir: ./frontend

tasks:
    install:
        desc: "Install frontend dependencies"
        dir: frontend
        cmds:
            - bun install
        silent: true

    dev:
        desc: "Run the backend and the Vite dev server concurrently (backend :8080, frontend :3000, proxied)"
        deps:
            - backend:run
            - frontend:dev
        silent: true

    frontend:embed:
        desc: "Build the frontend and embed it into the backend"
        cmds:
            - task: frontend:build
            - rm -rf ./backend/web/dist
            - mv ./frontend/dist ./backend/web/dist
            - touch ./backend/web/dist/.gitkeep
        silent: true
        internal: true

    build:
        desc: "Build the frontend, embed it, and build the Go binary — the single deployable artifact"
        cmds:
            - task: frontend:build
            - task: backend:build
        silent: true

    verify:
        desc: "Pre-release check: frontend lint/format, then the backend's vet+build+race test suite"
        cmds:
            - task: frontend:lint
            - task: frontend:check
            - task: backend:verify
        silent: true
